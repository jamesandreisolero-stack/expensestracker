<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="SpendWise is a simple expense tracker for students. Data is saved in your browser.">
  <meta name="theme-color" content="#0e1426">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%B0%3C/text%3E%3C/svg%3E">
  <title>Add expense | SpendWise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body data-page="add">
  <a class="skip-link" href="#main">Skip to content</a>
  <nav class="navbar navbar-expand-md sw-nav">
    <div class="container">
      <a class="navbar-brand" href="../index.html">SpendWise</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav" aria-controls="nav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="../index.html">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="add-expense.html" aria-current="page">Add expense</a></li>
          <li class="nav-item"><a class="nav-link" href="history.html">History</a></li>
        </ul>
      </div>
    </div>
  </nav>
  <main id="main" class="container py-4">
    <h1 class="mb-4">Add expense</h1>
    <section class="panel" style="max-width: 640px;" aria-labelledby="formHeading">
      <h2 id="formHeading" class="visually-hidden">New expense form</h2>
      <div id="formAlert" role="status" aria-live="polite"></div>
      <form id="expenseForm" novalidate>
        <div class="mb-3">
          <label for="description" class="form-label">What did you spend on?</label>
          <input type="text" class="form-control" id="description" maxlength="60" required>
          <div class="invalid-feedback"></div>
        </div>
        <div class="row">
          <div class="col-sm-6 mb-3">
            <label for="amount" class="form-label">Amount (PHP)</label>
            <input type="number" class="form-control" id="amount" min="0.01" step="0.01" inputmode="decimal" required>
            <div class="invalid-feedback"></div>
          </div>
          <div class="col-sm-6 mb-3">
            <label for="date" class="form-label">Date</label>
            <input type="date" class="form-control" id="date" required>
            <div class="invalid-feedback"></div>
          </div>
        </div>
        <div class="mb-4">
          <label for="category" class="form-label">Category</label>
          <select class="form-select" id="category" required></select>
          <div class="invalid-feedback"></div>
        </div>
        <button type="submit" class="btn btn-primary">Add expense</button>
      </form>
    </section>
  </main>
  <footer class="container pb-4">
    <p class="mb-0">Frontend demonstration. Your data is saved only in this browser.</p>
  </footer>
  <noscript><p class="container">This app needs JavaScript turned on.</p></noscript>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/script.js"></script>
</body>
</html>
