<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard | SpendWise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body data-page="dashboard">
  <a class="skip-link" href="#main">Skip to content</a>
  <nav class="navbar navbar-expand-md sw-nav">
    <div class="container">
      <a class="navbar-brand" href="index.html">SpendWise</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav" aria-controls="nav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html" aria-current="page">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="pages/add-expense.html">Add expense</a></li>
          <li class="nav-item"><a class="nav-link" href="pages/history.html">History</a></li>
        </ul>
      </div>
    </div>
  </nav>
  <main id="main" class="container py-4">
    <h1 class="mb-1">Dashboard</h1>
    <p class="text-muted-ink mb-4" id="monthName"></p>

    <section class="panel mb-4" aria-labelledby="budgetHeading">
      <h2 id="budgetHeading" class="visually-hidden">Monthly budget</h2>
      <div class="meter-amount" id="meterAmount" aria-live="polite">&#8369;0.00</div>
      <p class="mb-3" id="meterStatus">spent this month.</p>
      <div class="progress" role="progressbar" aria-label="Budget used" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
        <div class="progress-bar" id="meterBar" style="width:0%"></div>
      </div>
      <p class="mt-3 mb-0 text-muted-ink">Spent this month: <strong id="monthTotal">&#8369;0.00</strong></p>
    </section>

    <div class="row g-4">
      <div class="col-lg-6">
        <section class="panel h-100" aria-labelledby="catHeading">
          <h2 id="catHeading">Spending by category</h2>
          <div id="categoryList"></div>
        </section>
      </div>
      <div class="col-lg-6">
        <section class="panel mb-4" aria-labelledby="recentHeading">
          <h2 id="recentHeading">Recent expenses</h2>
          <div id="recentList"></div>
        </section>
        <section class="panel" aria-labelledby="setBudgetHeading">
          <h2 id="setBudgetHeading">Monthly budget</h2>
          <form id="budgetForm" novalidate>
            <label for="budgetInput" class="form-label">Budget amount (PHP)</label>
            <div class="input-group has-validation">
              <input type="number" class="form-control" id="budgetInput" min="1" step="0.01" inputmode="decimal" required>
              <button class="btn btn-primary" type="submit">Save budget</button>
              <div class="invalid-feedback"></div>
            </div>
            <p class="mt-2 mb-0 text-success" id="budgetMsg" role="status"></p>
          </form>
        </section>
      </div>
    </div>
  </main>
  <footer class="container pb-4">
    <p class="mb-0">Frontend demonstration. Your data is saved only in this browser.</p>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/script.js"></script>
</body>
</html>
