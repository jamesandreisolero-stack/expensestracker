<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="SpendWise is a simple expense tracker for students. Data is saved in your browser.">
  <meta name="theme-color" content="#0e1426">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%B0%3C/text%3E%3C/svg%3E">
  <title>History | SpendWise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body data-page="history">
  <a class="skip-link" href="#main">Skip to content</a>
  <nav class="navbar navbar-expand-md sw-nav">
    <div class="container">
      <a class="navbar-brand" href="../index.html">SpendWise</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav" aria-controls="nav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="../index.html">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="add-expense.html">Add expense</a></li>
          <li class="nav-item"><a class="nav-link" href="history.html" aria-current="page">History</a></li>
        </ul>
      </div>
    </div>
  </nav>
  <main id="main" class="container py-4">
    <h1 class="mb-4">History</h1>
    <section class="panel mb-3" aria-labelledby="filterHeading">
      <h2 id="filterHeading" class="visually-hidden">Search and filter</h2>
      <div class="row g-3">
        <div class="col-md-5">
          <label for="search" class="form-label">Search description</label>
          <input type="search" class="form-control" id="search" placeholder="e.g. lunch">
        </div>
        <div class="col-6 col-md-3">
          <label for="filterCategory" class="form-label">Category</label>
          <select class="form-select" id="filterCategory"></select>
        </div>
        <div class="col-6 col-md-4">
          <label for="sortBy" class="form-label">Sort by</label>
          <select class="form-select" id="sortBy">
            <option value="newest">Newest first</option>
            <option value="oldest">Oldest first</option>
            <option value="high">Highest amount</option>
            <option value="low">Lowest amount</option>
          </select>
        </div>
      </div>
    </section>

    <p class="fw-semibold" id="resultCount" aria-live="polite"></p>
    <div class="panel p-0">
      <div class="table-responsive">
        <table class="table align-middle mb-0">
          <thead>
            <tr><th scope="col">Date</th><th scope="col">Description</th><th scope="col">Category</th><th scope="col" class="text-end">Amount</th><th scope="col"><span class="visually-hidden">Actions</span></th></tr>
          </thead>
          <tbody id="expenseRows"></tbody>
        </table>
      </div>
    </div>

    <div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteTitle" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title fs-5" id="deleteTitle">Delete this expense?</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">This removes it from your history and totals. You cannot undo this.</div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Keep expense</button>
            <button type="button" class="btn btn-danger" id="confirmDelete">Delete expense</button>
          </div>
        </div>
      </div>
    </div>
  </main>
  <footer class="container pb-4">
    <p class="mb-0">Frontend demonstration. Your data is saved only in this browser.</p>
  </footer>
  <noscript><p class="container">This app needs JavaScript turned on.</p></noscript>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/script.js"></script>
</body>
</html>
